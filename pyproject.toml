[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-automation"
version = "1.1.0"
description = "Computer-use automation: LLM discovery -> typed capability artifacts -> deterministic replay, with human handoff and safety guardrails"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.49",
  "pydantic>=2.7",
  "flask>=3.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "anthropic>=1.0",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
cua = "cua.cli:main"

[tool.setuptools.packages.find]
include = ["cua*", "target_app*"]

[tool.setuptools.package-data]
cua = ["web/*.html"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
